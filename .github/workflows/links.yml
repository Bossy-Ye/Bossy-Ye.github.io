name: links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so repository or project-site rot is caught even without a commit.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,429
            './**/*.html'
          fail: true
